# Netlify normalizes trailing slashes before matching rules. Proxy both forms.
[[redirects]]
  from = "/flight-scanner/*"
  to = "https://d1uncn6ldth76u.cloudfront.net/flight-scanner/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/flight-scanner"
  to = "https://d1uncn6ldth76u.cloudfront.net/flight-scanner/"
  status = 200
  force = true
